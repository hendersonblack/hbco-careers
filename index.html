<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#006DCA">
<title>Sweet Career Match</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one-screen phone app. Henderson Black & Co colours and type (Palatino headings, Arial text, hb-blue primary; teal/citron/grey as fills only), with soft rounded cards and gentle motion. */
:root{
  --hb-blue:#006DCA; --hb-blue-text:#006DCA; --hb-blue-deep:#0058A6; --hb-teal:#669999; --hb-citron:#CCCC00; --hb-grey:#CCCCCC; --on-brand:#FFFFFF;
  --surface:#FFFFFF; --surface-alt:#F1F5F9; --page:#EEF3F8; --ink:#1B2430; --muted:#56616E; --hairline:#D6DDE4;
  --good:#1F7A45; --warn:#A94A12; --shadow:0 1px 2px rgba(16,40,70,.06),0 6px 18px rgba(16,40,70,.07);
  --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:Arial,Helvetica,"Liberation Sans",sans-serif;
  --r-lg:20px; --r:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --hb-blue-text:#5AA6EA; --surface:#0F1822; --surface-alt:#18232F; --page:#0B131B; --ink:#EEF2F6; --muted:#A6B0BB; --hairline:#2E3B48;
  --good:#5DBB84; --warn:#E39159; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --hb-blue-text:#5AA6EA; --surface:#0F1822; --surface-alt:#18232F; --page:#0B131B; --ink:#EEF2F6; --muted:#A6B0BB; --hairline:#2E3B48;
  --good:#5DBB84; --warn:#E39159; --shadow:none; color-scheme:dark }

html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hb-blue)}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--hb-citron);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hb-blue);color:var(--on-brand);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 10px rgba(0,40,90,.18)}
.mark{background:none;border:0;padding:0;color:var(--on-brand);text-align:left;display:flex;flex-direction:column;line-height:1.1}
.mark b{font-family:var(--serif);font-size:18px}
.mark small{font-family:var(--serif);font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.9}
.boxbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;font-weight:700;color:var(--on-brand);display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;transition:background .2s}
.boxbtn:hover{background:rgba(255,255,255,.24)}
.boxbtn b{background:#FFFFFF;color:#006DCA;border-radius:999px;padding:0 8px}

main{max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:16px}
.screen > *{animation:rise .42s var(--ease) both}
.screen > *:nth-child(2){animation-delay:.04s}.screen > *:nth-child(3){animation-delay:.08s}.screen > *:nth-child(4){animation-delay:.12s}
.screen > *:nth-child(5){animation-delay:.16s}.screen > *:nth-child(6){animation-delay:.2s}.screen > *:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--serif);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--hb-blue-text)}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance;line-height:1.12;font-weight:700}
h1{font-size:clamp(30px,8.5vw,40px);color:var(--hb-blue-text)}
h2{font-size:clamp(23px,6.2vw,26px);color:var(--hb-blue-text)}
h3{font-size:19px;color:var(--hb-blue-text)}
p{margin:0}
.lead{font-size:17px;color:var(--muted)}

.btn{border:0;border-radius:var(--r);padding:16px 20px;font-weight:700;font-size:17px;background:var(--hb-blue);color:var(--on-brand);width:100%;text-align:center;text-decoration:none;display:block;
  box-shadow:0 4px 14px rgba(0,109,202,.28);transition:transform .15s var(--ease),box-shadow .2s,background .2s}
.btn:hover{background:var(--hb-blue-deep)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--hairline);box-shadow:none}
.btn.small{width:auto;padding:10px 16px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.link{background:none;border:0;color:var(--muted);font-weight:700;padding:6px 0;text-align:left;font-size:14px}

/* home */
.hero{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--hairline);padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.logo{background:#FFFFFF;align-self:flex-start;padding:10px 12px;border-radius:var(--r-sm)}
.logo img{display:block;width:170px;height:auto;max-width:100%}
.teasers{display:flex;flex-wrap:wrap;gap:8px}
.teasers span{font-size:13px;font-weight:700;padding:6px 12px 6px 8px;border-radius:999px;background:var(--surface-alt);display:flex;align-items:center;gap:7px}
.teasers span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--hb-teal)}
.teasers span:nth-child(3n+2)::before{background:var(--hb-citron)}
.teasers span:nth-child(3n)::before{background:var(--hb-blue)}
.stats{display:flex;gap:20px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--ink);font-family:var(--serif);font-size:22px;display:block;line-height:1.1}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:var(--r-sm);border-left:4px solid var(--warn);padding:8px 12px}
.note.info{border-color:var(--hb-teal)}

/* question */
.progress{height:8px;border-radius:999px;background:var(--hairline);overflow:hidden}
.progress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--hb-blue),var(--hb-teal));transition:width .45s var(--ease)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid transparent;box-shadow:var(--shadow);border-radius:var(--r);padding:14px 16px;font-weight:700;font-size:16px;min-height:60px;
  transition:transform .15s var(--ease),border-color .2s,background .2s}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-alt);color:var(--hb-blue-text);font-family:var(--serif);font-size:15px;transition:background .2s,color .2s}
.opt:hover{border-color:var(--hb-teal)}
.opt:active{transform:scale(.98)}
.opt.picked{border-color:var(--hb-blue);background:var(--surface-alt)}
.opt.picked .k{background:var(--hb-blue);color:var(--on-brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--hairline);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;transition:transform .15s var(--ease),background .2s,border-color .2s,color .2s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--hb-blue);border-color:var(--hb-blue);color:var(--on-brand)}

/* result */
.result-head{background:linear-gradient(135deg,var(--hb-blue),var(--hb-blue-deep));color:var(--on-brand);border-radius:var(--r-lg);padding:22px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 26px rgba(0,88,166,.28)}
.result-head .eyebrow{color:var(--on-brand);opacity:.85}
.result-head h1{color:var(--on-brand)}
.pill{align-self:flex-start;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.result-head p{font-size:17px}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--hairline);padding:18px;display:flex;flex-direction:column;gap:10px}
.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.panel.hb{border-left:6px solid var(--hb-blue)}
.panel.alt{background:var(--surface-alt);box-shadow:none}
.sweet{background:var(--surface);border:2px dashed var(--hb-teal);border-radius:var(--r-lg);padding:16px;display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.sweet svg{width:110px;height:auto;max-width:100%;display:block;animation:drop .8s cubic-bezier(.2,.8,.3,1.25) .15s both}
.sweet .give{font-family:var(--serif);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sweet .name{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.1}
.sweet .why{font-size:15px;color:var(--muted);margin-top:4px}
.tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-alt);color:var(--good)}
.tag.wild{color:var(--warn)}
.claim{background:var(--surface);border:2px dashed var(--hb-teal);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center}
.claim svg{width:96px;height:auto;animation:wobble 2.4s ease-in-out infinite}
.route{font-size:14px;color:var(--muted)}
.qrwrap{background:#FFFFFF;padding:14px;border-radius:var(--r);align-self:center;width:min(100%,300px)}
.qrwrap svg{display:block;width:100%;height:auto}
.small-print{font-size:12px;color:var(--muted)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types .opt{justify-content:center;text-align:center;min-height:72px}
@keyframes drop{0%{transform:translateY(-40px) rotate(-35deg) scale(.5);opacity:0}60%{transform:translateY(4px) rotate(8deg) scale(1.08);opacity:1}100%{transform:none}}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

/* box sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--page);overflow:auto;animation:sheetin .3s var(--ease);
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@keyframes sheetin{from{transform:translateY(24px);opacity:.001}to{transform:none;opacity:1}}
.sheet-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stock{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--hairline);padding:10px 12px}
.srow.off{opacity:.5}
.swatch{width:26px;height:26px;border-radius:50%}
.srow .nm{font-weight:700;min-width:0}
.srow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.bar-mini{height:6px;border-radius:999px;background:var(--hairline);margin-top:5px;overflow:hidden}
.bar-mini span{display:block;height:100%;border-radius:999px;background:var(--hb-teal);transition:width .3s var(--ease)}
.ctrl{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.ctrl button{width:36px;height:36px;border-radius:50%;border:1px solid var(--hairline);background:var(--surface-alt);font-weight:700;font-size:18px}
.ctrl output{min-width:28px;text-align:center;font-weight:700;font-size:17px}
.toggle{font-size:12px;font-weight:700;border:1px solid var(--hairline);background:none;border-radius:999px;padding:3px 9px;color:var(--muted)}
.setall{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.setall input{width:72px;padding:10px;border-radius:var(--r-sm);border:1px solid var(--hairline);background:var(--surface);font-weight:700}
.tally{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.tally b{text-align:right}
.danger{color:var(--warn)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <button class="mark" id="homeBtn" type="button" aria-label="Back to start"><b>Henderson Black &amp; Co</b><small>Chartered Accountants</small></button>
  <button class="boxbtn" id="boxBtn" type="button">Sweet box <b id="leftCount">0</b></button>
</header>
<main id="app"></main>
<section class="sheet" id="sheet" hidden aria-label="Sweet box"></section>

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {

        }

          continue;

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var col = pos[j];

          if (_modules[row][col] != null) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {

        if (i < 8) {

      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var ecdata = new Array(rsBlocks.length);

      return data;

  {id:"orange",name:"Orange Crème",color:"#EC7A1C",line:"Zesty and a bit different. Keeps every meeting lively."},
  {id:"block",name:"Milk Choc Block",color:"#2C6FA8",line:"Solid and no-nonsense. Does exactly what it says, like a good balance sheet."},
  {id:"honeycomb",name:"Honeycomb Crunch",color:"#C98A12",line:"Full of hidden pockets. Crunch the numbers, find the gold."}
];

/* ---------- state ---------- */
const KEY="hbco-sweet-match-v1";
let store = load();
const blankRun=()=>({screen:"home",qi:0,answers:[],traits:[],result:null,sweet:null,claimed:false});
let run = blankRun();

function freshStore(){
  const s={};SWEETS.forEach(x=>s[x.id]={on:true,start:8,left:8});
  return {sweets:s,played:0,types:{},history:[]};
}
function load(){
  if(PUPIL)return freshStore();
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);const f=freshStore();
    SWEETS.forEach(x=>{if(!d.sweets[x.id])d.sweets[x.id]=f.sweets[x.id]});d.history=d.history||[];d.types=d.types||{};return d;}}catch(e){}
  return freshStore();
}
function save(){if(PUPIL)return;try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){} updateCount();}
function totalLeft(){return SWEETS.reduce((n,x)=>n+(store.sweets[x.id].on?store.sweets[x.id].left:0),0)}
function updateCount(){document.getElementById("leftCount").textContent=totalLeft()}

/* ---------- logic ---------- */
function scoreResult(){
  const t={};Object.keys(TYPES).forEach(k=>t[k]=0);
  run.answers.forEach((a,i)=>{const s=QUESTIONS[i].o[a][1];for(const k in s)t[k]+=s[k]});
  run.traits.forEach(i=>{const s=TRAITS[i][1];for(const k in s)t[k]+=s[k]});
  const max=Math.max(...Object.values(t));
  const top=Object.keys(t).filter(k=>t[k]===max);
  return top[Math.floor(Math.random()*top.length)];
}
// Balancing: match strength × share of that sweet still left. Popular matches run low, so the next pick moves on.
function pickSweet(typeKey,exclude=[]){
  const pref=TYPES[typeKey].sweets;
  let best=null,bestScore=-1;
  SWEETS.forEach(x=>{
    const s=store.sweets[x.id];
    if(!s.on||s.left<=0||exclude.includes(x.id))return;
    const idx=pref.indexOf(x.id);
    const aff=idx===0?1:idx===1?.85:idx===2?.7:.45;
    const share=s.left/Math.max(s.start,s.left,1);
    const sc=aff*share+Math.random()*.03;
    if(sc>bestScore){bestScore=sc;best=x.id}
  });
  return best;
}
function take(id,type){store.sweets[id].left--;store.history.push({sweet:id,type});save()}
function giveBack(id){store.sweets[id].left++;const h=store.history;for(let i=h.length-1;i>=0;i--){if(h[i].sweet===id){h.splice(i,1);break}}save()}
function award(type){
  run.result=type;run.sweet=pickSweet(type);
  if(run.sweet)take(run.sweet,type);
  store.played++;store.types[type]=(store.types[type]||0)+1;save();
}

/* ---------- email text (sent by the pupil, never collected) ---------- */
function subjectLine(){return `My careers fair result: ${TYPES[run.result].name}`}
function fullText(){
  const T=TYPES[run.result];
  return [
    `My result from the ${FIRM} careers fair game.`,"",
    `I'D MAKE A BRILLIANT: ${T.name.toUpperCase()}`,
    `Real job: ${T.role}`,T.tag,"",
    "Work that would suit me:",...T.work.map(w=>"- "+w),"",
    `Where I'd do it: ${T.where}`,"",
    `How this links to ${FIRM}:`,T.hb,"",
    `Did you know? ${T.fact}`,"",
    "How to get there:",
    "Every one of these careers starts by training as a chartered accountant (CA) with ICAS. You can start straight from school, through an apprenticeship or after university, and get paid while you train.","",
    "Find out more:",...LINKS.map(l=>`${l[0]}: ${l[1]}`),"",
    `${FIRM}, Chartered Accountants`,OFFICES,"www.hendersonblack.co.uk"
  ].join("\n");
}
function shortText(){
  const T=TYPES[run.result];
  return [
    `My ${FIRM} careers fair result: ${T.name} (${T.role}).`,"",
    `At ${FIRM}: ${T.hbShort}`,"",
    `Careers: ${LINKS[0][1]}`,
    `Routes to CA: ${LINKS[1][1]}`
  ].join("\n");
}
function mailto(subject,body){return `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`}
function qrSVG(text,label){
  if(typeof qrcode!=="function")return null;
  try{
    const q=qrcode(0,"L");q.addData(text);q.make();
    const n=q.getModuleCount(),m=2;let d="";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="${label}"><rect width="100%" height="100%" fill="#FFFFFF"/><path d="${d}" fill="#000000"/></svg>`;
  }catch(e){return null}
}
function pupilURL(){return location.href.split("#")[0]+"#pupil"}

/* ---------- render ---------- */
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const r={home:renderHome,q:renderQ,traits:renderTraits,result:renderResult,claim:renderClaim,standqr:renderStandQR}[run.screen];
  app.innerHTML=r();bind();window.scrollTo({top:0});
}
function progress(now){return `<div class="progress" aria-hidden="true"><span style="width:${Math.round(100*(now+1)/(QUESTIONS.length+1))}%"></span></div>`}
function renderHome(){
  const tease=Object.values(TYPES).map(t=>`<span>${esc(t.name.replace("The ",""))}</span>`).join("");
  const presenterExtras=PUPIL?"":`
    <div class="row">
      <button class="btn ghost" data-act="claimstart" type="button">Hand out a sweet</button>
      ${HOSTED?'<button class="btn ghost" data-act="standqr" type="button">Show pupil QR</button>':""}
    </div>
    <div class="stats">
      <div><b>${store.played}</b>pupils played</div>
      <div><b>${totalLeft()}</b>sweets left</div>
    </div>
    <p class="note">Ask about allergies before handing out. Quality Street contains milk, and The Purple One and Green Triangle contain hazelnuts. Use “Swap sweet” if needed.</p>`;
  return `<div class="screen">
    <div class="hero">
      <div class="logo"><img src="${LOGO}" alt="Henderson Black & Co, Chartered Accountants"></div>
      <div class="eyebrow">Careers fair game</div>
      <h1>Which accountant are you?</h1>
      <p class="lead">Six quick questions, one career match${PUPIL?", then show your result at our stand for a sweet.":" and a sweet to take away."}</p>
      <div class="teasers">${tease}</div>
      <button class="btn" data-act="start" type="button">${PUPIL?"Let's go":"Start a new pupil"}</button>
    </div>
    ${presenterExtras}
  </div>`;
}
function renderQ(){
  const Q=QUESTIONS[run.qi],keys="ABCDE";
  const opts=Q.o.map((o,i)=>`<button class="opt${run.answers[run.qi]===i?" picked":""}" data-act="ans" data-i="${i}" type="button"><span class="k">${keys[i]}</span><span>${esc(o[0])}</span></button>`).join("");
  return `<div class="screen">
    ${progress(run.qi)}
    <div class="eyebrow">Question ${run.qi+1} of ${QUESTIONS.length}</div>
    <h2>${esc(Q.q)}</h2>
    <div class="opts">${opts}</div>
    <button class="link" data-act="back" type="button">← Back</button>
  </div>`;
}
function renderTraits(){
  const chips=TRAITS.map((t,i)=>`<button class="chip" aria-pressed="${run.traits.includes(i)}" data-act="trait" data-i="${i}" type="button">${esc(t[0])}</button>`).join("");
  return `<div class="screen">
    ${progress(QUESTIONS.length)}
    <div class="eyebrow">Last one</div>
    <h2>Tap any words that sound like you.</h2>
    <p class="lead" style="font-size:15px">Pick as many as you like, or none.</p>
    <div class="chips">${chips}</div>
    <button class="btn" data-act="reveal" type="button">Reveal my match</button>
    <button class="link" data-act="back" type="button">← Back</button>
  </div>`;
}
function sweetSVG(c){
  return `<svg viewBox="0 0 200 110" role="img" aria-label="Wrapped sweet">
    <path d="M62 55 L14 18 Q8 55 14 92 Z" fill="${c}"/>
    <path d="M138 55 L186 18 Q192 55 186 92 Z" fill="${c}"/>
    <path d="M62 55 L14 18 M62 55 L22 40 M62 55 L22 70 M62 55 L14 92 M138 55 L186 18 M138 55 L178 40 M138 55 L178 70 M138 55 L186 92" stroke="#000" stroke-opacity=".18" stroke-width="2" fill="none"/>
    <ellipse cx="100" cy="55" rx="44" ry="34" fill="${c}"/>
    <ellipse cx="100" cy="55" rx="44" ry="34" fill="none" stroke="#000" stroke-opacity=".15" stroke-width="2"/>
    <ellipse cx="86" cy="40" rx="18" ry="8" fill="#fff" fill-opacity=".38" transform="rotate(-18 86 40)"/>
  </svg>`;
}
function sweetBlock(){
  const T=TYPES[run.result];
  if(!run.sweet)return `<div class="panel"><h3>Box empty</h3><p>No sweets left. Give them a high five and a careers pack instead.</p></div>`;
  const S=SWEETS.find(x=>x.id===run.sweet),match=T.sweets.includes(S.id);
  return `<div class="sweet">${sweetSVG(S.color)}
    <div style="min-width:0"><div class="give">Your sweet</div><div class="name">${esc(S.name)}</div>
    <p class="why">${esc(S.line)}</p><span class="tag${match?"":" wild"}">${match?"Perfect match":"Lucky wildcard"}</span></div></div>`;
}
function takeHome(){
  if(PUPIL){
    return `<div class="panel"><h3>Keep your result</h3>
      <p>Send it to yourself, or just take a screenshot.</p>
      <a class="btn" href="${mailto(subjectLine(),fullText())}">Email it to myself</a>
      <p class="small-print">Opens your own email app. Nothing you do in this game is sent to us or saved.</p></div>`;
  }
  const svg=qrSVG(mailto(subjectLine(),shortText()),"QR code that opens an email with this result");
  return `<div class="panel"><h3>Take your result home</h3>
    ${svg?`<p>Point your phone camera at the code. Your email app opens with your result filled in. Type in your own email address and press send.</p>
    <div class="qrwrap">${svg}</div>
    <p class="small-print">Nothing is shared with us: the email goes from your phone to you.</p>`
    :`<p class="note">The QR code couldn't load. Check the phone has signal, then reopen this result.</p>`}</div>`;
}
function renderResult(){
  const T=TYPES[run.result];
  const top=PUPIL
    ?`<div class="claim">${sweetSVG("#6A2C8E")}<h3>Your sweet is waiting</h3><p>Show this screen at the Henderson Black &amp; Co stand to collect your Quality Street.</p></div>`
    :`${sweetBlock()}
      <div class="row"><button class="btn" data-act="next" type="button">Next pupil</button>
      ${run.sweet?'<button class="btn ghost" data-act="swap" type="button">Swap sweet</button>':""}</div>`;
  return `<div class="screen">
    <div class="result-head">
      <div class="eyebrow">You'd make a brilliant…</div>
      <h1>${esc(T.name)}</h1>
      <span class="pill">Real job: ${esc(T.role)}</span>
      <p>${esc(T.tag)}</p>
    </div>
    ${top}
    <div class="panel hb"><h3>How this links to Henderson Black &amp; Co</h3><p>${esc(T.hb)}</p></div>
    <div class="panel"><h3>Work that would suit you</h3><ul>${T.work.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
    <div class="panel"><h3>Where you'd do it</h3><p>${esc(T.where)}</p></div>
    <div class="panel alt"><h3>Did you know?</h3><p>${esc(T.fact)}</p></div>
    ${takeHome()}
    <p class="route">Every one of these careers starts by training as a chartered accountant (CA) with ICAS. You can start straight from school, through an apprenticeship or after university, and get paid while you train. Ask us about training with us in Cupar or St Andrews.</p>
    ${PUPIL?'<button class="btn ghost" data-act="next" type="button">Play again</button>':""}
  </div>`;
}
function renderClaim(){
  if(run.claimed){
    return `<div class="screen">
      <div class="eyebrow">Sweet for ${esc(TYPES[run.result].name)}</div>
      ${sweetBlock()}
      <div class="row"><button class="btn" data-act="next" type="button">Done</button>
      ${run.sweet?'<button class="btn ghost" data-act="swap" type="button">Swap sweet</button>':""}</div>
    </div>`;
  }
  const btns=Object.keys(TYPES).map(k=>`<button class="opt" data-act="claimtype" data-k="${k}" type="button">${esc(TYPES[k].name.replace("The ",""))}</button>`).join("");
  return `<div class="screen">
    <div class="eyebrow">Played on their own phone</div>
    <h2>Which result are they showing you?</h2>
    <div class="types">${btns}</div>
    <button class="link" data-act="next" type="button">← Back</button>
  </div>`;
}
function renderStandQR(){
  const svg=qrSVG(pupilURL(),"QR code to play the game on your own phone");
  return `<div class="screen">
    <div class="eyebrow">Play on your own phone</div>
    <h2>Scan to find out which accountant you are</h2>
    ${svg?`<div class="qrwrap">${svg}</div>`:'<p class="note">The QR code couldn\'t load.</p>'}
    <p class="small-print" style="text-align:center;word-break:break-all">${esc(pupilURL())}</p>
    <button class="btn ghost" data-act="next" type="button">Done</button>
  </div>`;
}

function bind(){
  app.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.act,+b.dataset.i,b)));
}
let busy=false;
function act(a,i,el){
  if(a==="start"){run=blankRun();run.screen="q";wake();}
  else if(a==="ans"){
    if(busy)return;busy=true;
    run.answers[run.qi]=i;
    app.querySelectorAll(".opt").forEach(o=>o.classList.remove("picked"));el.classList.add("picked");
    const bar=app.querySelector(".progress span");if(bar)bar.style.width=Math.round(100*(run.qi+2)/(QUESTIONS.length+1))+"%";
    setTimeout(()=>{busy=false;if(run.qi<QUESTIONS.length-1)run.qi++;else run.screen="traits";render()},230);
    return;
  }
  else if(a==="back"){
    if(run.screen==="traits"){run.screen="q";run.qi=QUESTIONS.length-1}
    else if(run.qi>0)run.qi--;else run.screen="home";
  }
  else if(a==="trait"){const k=run.traits.indexOf(i);k>=0?run.traits.splice(k,1):run.traits.push(i);
    el.setAttribute("aria-pressed",k<0);return;}
  else if(a==="reveal"){
    const type=scoreResult();
    if(PUPIL)run.result=type;else award(type);
    run.screen="result";
  }
  else if(a==="swap"){
    const old=run.sweet;const nu=pickSweet(run.result,[old]);
    if(nu){giveBack(old);take(nu,run.result);run.sweet=nu}
    else{flash("No other sweets left to swap to.");return}
  }
  else if(a==="claimstart"){run=blankRun();run.screen="claim";}
  else if(a==="claimtype"){award(el.dataset.k);run.claimed=true;}
  else if(a==="standqr"){run=blankRun();run.screen="standqr";}
  else if(a==="next"){run=blankRun()}
  render();
}
function flash(msg,kind){const p=document.createElement("p");p.className="note"+(kind?" "+kind:"");p.textContent=msg;const s=app.querySelector(".screen");s.appendChild(p);p.scrollIntoView({block:"nearest",behavior:"smooth"});setTimeout(()=>p.remove(),3500)}

let lock=null;
async function wake(){if(PUPIL)return;try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>lock=null)}}catch(e){}}

/* ---------- sweet box sheet ---------- */
const sheet=document.getElementById("sheet");
let confirmReset=null;
function renderSheet(){
  const rows=SWEETS.map(x=>{const s=store.sweets[x.id];const pct=s.start?Math.round(100*s.left/Math.max(s.start,s.left)):0;
    return `<div class="srow${s.on?"":" off"}">
      <span class="swatch" style="background:${x.color}"></span>
      <div class="nm">${esc(x.name)}<small>${s.on?`${s.left} of ${s.start} left`:"Not in this box"} · <button class="toggle" data-s="tog" data-id="${x.id}" type="button">${s.on?"Remove":"Add back"}</button></small>
        <div class="bar-mini"><span style="width:${s.on?pct:0}%"></span></div></div>
      <div class="ctrl"><button data-s="dec" data-id="${x.id}" type="button" aria-label="One fewer ${esc(x.name)}">−</button><output>${s.left}</output><button data-s="inc" data-id="${x.id}" type="button" aria-label="One more ${esc(x.name)}">+</button></div>
    </div>`}).join("");
  const tally=Object.keys(TYPES).map(k=>`<span>${esc(TYPES[k].name)}</span><b>${store.types[k]||0}</b>`).join("");
  const last=store.history[store.history.length-1];
  sheet.innerHTML=`<div class="sheet-inner">
    <div class="sheet-top"><h2>Sweet box</h2><button class="btn ghost small" data-s="close" type="button">Done</button></div>
    <p class="note info">Count each sweet in your box and set the numbers here. The game hands out whichever matching sweet has the most left, so the box empties evenly.</p>
    <div class="setall"><label for="setN">Set every sweet to</label><input id="setN" type="number" min="0" inputmode="numeric" value="8"><button class="btn small" data-s="setall" type="button">Apply</button></div>
    <div class="stock">${rows}</div>
    ${last?`<button class="btn ghost" data-s="undo" type="button">Undo last sweet (${esc(SWEETS.find(x=>x.id===last.sweet).name)})</button>`:""}
    <div class="panel"><h3>Today's matches · ${store.played} pupils</h3><div class="tally">${tally}</div></div>
    <div class="confirm">${confirmReset?`<span>Reset all counts and stats?</span><button class="btn small" style="background:var(--warn);box-shadow:none" data-s="resetyes" type="button">Yes, reset</button><button class="link" data-s="resetno" type="button">Cancel</button>`:`<button class="link danger" data-s="reset" type="button">Reset counts and stats</button>`}</div>
  </div>`;
  sheet.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>sheetAct(b.dataset.s,b.dataset.id)));
}
function sheetAct(a,id){
  const s=id&&store.sweets[id];
  if(a==="close"){sheet.hidden=true;confirmReset=null;if(run.screen==="home")render();return}
  if(a==="inc"){s.left++;if(s.left>s.start)s.start=s.left}
  if(a==="dec"&&s.left>0)s.left--;
  if(a==="tog")s.on=!s.on;
  if(a==="setall"){const n=Math.max(0,parseInt(document.getElementById("setN").value)||0);SWEETS.forEach(x=>{store.sweets[x.id].start=n;store.sweets[x.id].left=n})}
  if(a==="undo"){const h=store.history.pop();if(h){store.sweets[h.sweet].left++;}}
  if(a==="reset"){confirmReset=true;renderSheet();return}
  if(a==="resetno"){confirmReset=null;renderSheet();return}
  if(a==="resetyes"){const on={};SWEETS.forEach(x=>on[x.id]=store.sweets[x.id].on);store=freshStore();SWEETS.forEach(x=>store.sweets[x.id].on=on[x.id]);confirmReset=null}
  save();renderSheet();
}
if(PUPIL)document.getElementById("boxBtn").hidden=true;
document.getElementById("boxBtn").addEventListener("click",()=>{renderSheet();sheet.hidden=false;sheet.scrollTop=0});
document.getElementById("homeBtn").addEventListener("click",()=>{run=blankRun();render()});

/* ---------- boot ---------- */
function start(d){if(d&&d.run)run=Object.assign(blankRun(),d.run);updateCount();render()}
window.claude?.hot?.snapshot?.(()=>({run}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
