:root{
  --hb-blue:#006DCA; --hb-blue-text:#006DCA; --hb-blue-deep:#0058A6; --hb-navy:#062B52; --hb-teal:#669999; --hb-citron:#CCCC00; --hb-grey:#CCCCCC; --on-brand:#FFFFFF;
  --surface:#FFFFFF; --surface-alt:#F1F5F9; --page:#EEF3F8; --ink:#1B2430; --muted:#56616E; --hairline:#D6DDE4;
  --good:#1F7A45; --warn:#A94A12; --shadow:0 1px 2px rgba(16,40,70,.06),0 6px 18px rgba(16,40,70,.07);
  --serif:"HB Pagella","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:Arial,Helvetica,"Liberation Sans",sans-serif;
  --r-lg:14px; --r:12px; --r-sm:8px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --hb-blue-text:#5AA6EA; --surface:#0F1822; --surface-alt:#18232F; --page:#0B131B; --ink:#EEF2F6; --muted:#A6B0BB; --hairline:#2E3B48;
  --good:#5DBB84; --warn:#E39159; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --hb-blue-text:#5AA6EA; --surface:#0F1822; --surface-alt:#18232F; --page:#0B131B; --ink:#EEF2F6; --muted:#A6B0BB; --hairline:#2E3B48;
  --good:#5DBB84; --warn:#E39159; --shadow:none; color-scheme:dark }

html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hb-blue)}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--hb-citron);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hb-blue);color:var(--on-brand);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 10px rgba(0,40,90,.18)}
.mark{background:none;border:0;padding:0;color:var(--on-brand);text-align:left;display:flex;flex-direction:column;line-height:1.1;min-width:0}
.mark b{font-family:var(--serif);font-size:clamp(14px,4.4vw,18px);white-space:nowrap}
.mark small{font-family:var(--serif);font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.9}
.tools{display:flex;gap:8px;align-items:center}
.pillbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--on-brand);display:flex;gap:6px;align-items:center;transition:background .2s,transform .15s var(--spring)}
.pillbtn:active{transform:scale(.92)}
.pillbtn svg{width:16px;height:16px;display:block}

main{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:16px}
.ready .screen > *{animation:rise .45s var(--ease) both}
.ready .screen > *:nth-child(2){animation-delay:.05s}.ready .screen > *:nth-child(3){animation-delay:.1s}.ready .screen > *:nth-child(4){animation-delay:.15s}
.ready .screen > *:nth-child(5){animation-delay:.2s}.ready .screen > *:nth-child(6){animation-delay:.25s}.ready .screen > *:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:.001;transform:translateY(16px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--serif);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--hb-blue-text)}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance;line-height:1.12;font-weight:700}
h1{font-size:clamp(30px,8.5vw,40px);color:var(--hb-blue-text)}
h2{font-size:clamp(24px,6.6vw,28px);color:var(--hb-blue-text)}
h3{font-size:19px;color:var(--hb-blue-text)}
p{margin:0}

.btn{position:relative;overflow:hidden;border:0;border-radius:var(--r);padding:16px 20px;font-weight:700;font-size:17px;background:var(--hb-blue);color:var(--on-brand);width:100%;text-align:center;text-decoration:none;display:block;
  box-shadow:0 4px 14px rgba(0,109,202,.3);transition:transform .18s var(--spring),box-shadow .2s,background .2s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--hairline);box-shadow:none}
.btn.small{width:auto;padding:10px 16px;font-size:15px}
.btn.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 14px rgba(0,109,202,.3)}50%{box-shadow:0 4px 30px rgba(0,109,202,.6),0 0 0 6px rgba(204,204,0,.35)}}
.btn.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%,40%{transform:translateX(-100%)}80%,100%{transform:translateX(100%)}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.link{background:none;border:0;color:var(--muted);font-weight:700;padding:6px 0;text-align:left;font-size:14px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:60;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* home: poster-style hero */
.hero{display:grid;grid-template-columns:1fr 44px;gap:8px}
.slab{background:var(--hb-blue);color:var(--on-brand);border-radius:var(--r-lg);padding:18px 18px 22px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 10px 26px rgba(0,88,166,.25)}
.slab .caps{font-family:var(--serif);font-size:12px;letter-spacing:.28em;text-transform:uppercase;opacity:.92}
.slab h1{color:var(--on-brand);font-size:clamp(38px,11vw,52px);line-height:.95}
.slab .lede{font-weight:700;font-size:16px;line-height:1.4}
.side{display:flex;flex-direction:column;gap:8px;align-items:center}
.side svg{width:44px;height:auto;display:block}
.side i{display:block;width:100%;flex:1;min-height:60px;border-radius:var(--r-sm)}
.side .bt{background:var(--hb-teal)} .side .bc{background:var(--hb-citron)}
.logo{background:#FFFFFF;align-self:flex-start;padding:6px 8px;border-radius:var(--r-sm);max-width:100%}
.logo img{display:block;width:210px;height:auto;max-width:100%}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:48px 1fr;border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--hairline)}
.step .num{display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:24px}
.n1{background:var(--hb-blue);color:var(--on-brand)} .n2{background:var(--hb-teal);color:#1B2430} .n3{background:var(--hb-citron);color:#1B2430}
.step .txt{padding:10px 14px;min-width:0}
.step b{display:block;font-family:var(--serif);font-size:19px;color:var(--hb-blue-text);line-height:1.15}
.step span{font-size:14px;color:var(--muted)}
.teasers{display:flex;flex-wrap:wrap;gap:8px}
.teasers span{font-size:13px;font-weight:700;padding:6px 12px 6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--hairline);display:flex;align-items:center;gap:7px}
.teasers span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--hb-teal)}
.teasers span:nth-child(3n+2)::before{background:var(--hb-citron)}
.teasers span:nth-child(3n)::before{background:var(--hb-blue)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:var(--r-sm);border-left:4px solid var(--warn);padding:8px 12px}
.note.info{border-color:var(--hb-teal)}

/* question */
.progress{height:10px;border-radius:999px;background:var(--hairline);overflow:hidden}
.progress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--hb-blue),var(--hb-teal),var(--hb-citron));background-size:200% 100%;transition:width .5s var(--spring);animation:flow 2s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qcount{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid transparent;box-shadow:var(--shadow);border-radius:var(--r);padding:14px 16px;font-weight:700;font-size:16px;min-height:60px;
  transition:transform .25s var(--spring),border-color .2s,background .2s,opacity .3s,filter .3s}
.opt .k{flex:none;width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--surface-alt);color:var(--hb-blue-text);font-family:var(--serif);font-size:15px;transition:background .2s,color .2s,transform .3s var(--spring)}
.opt:active{transform:scale(.97)}
.opt.picked{border-color:var(--hb-blue);background:var(--surface-alt);transform:scale(1.03);box-shadow:0 8px 24px rgba(0,109,202,.3)}
.opt.picked .k{background:var(--hb-blue);color:var(--on-brand);transform:rotate(360deg) scale(1.15)}
.opts.chosen .opt:not(.picked){opacity:.25;transform:translateX(-14px) scale(.97);filter:saturate(.3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--hairline);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;transition:transform .25s var(--spring),background .2s,border-color .2s,color .2s}
.chip:active{transform:scale(.9)}
.chip[aria-pressed="true"]{background:var(--hb-blue);border-color:var(--hb-blue);color:var(--on-brand);transform:scale(1.06)}

/* result */
.rh{display:grid;grid-template-columns:1fr 14px;gap:6px}
.rh .bars{display:flex;flex-direction:column;gap:6px}
.rh .bars i{flex:1;border-radius:6px}
.result-head{min-width:0;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hb-blue),var(--hb-blue-deep));color:var(--on-brand);border-radius:var(--r-lg);padding:22px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 26px rgba(0,88,166,.28)}
.result-head::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-100%);pointer-events:none}
.showtime .result-head{animation:pop .7s var(--spring) both}
.showtime .result-head::after{animation:shine 1.6s .5s ease-out 1 both}
@keyframes pop{0%{transform:scale(.6) rotate(-3deg);opacity:0}100%{transform:none;opacity:1}}
.result-head .eyebrow{color:var(--on-brand);opacity:.85}
.result-head h1{color:var(--on-brand)}
.pill{align-self:flex-start;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.result-head p{font-size:17px}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--hairline);padding:18px;display:flex;flex-direction:column;gap:10px}
.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.panel.hb{border-left:6px solid var(--hb-blue)}
.panel.alt{background:var(--surface-alt);box-shadow:none}
.sweet{background:var(--surface);border:2px dashed var(--hb-teal);border-radius:var(--r-lg);padding:16px;display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.sweet svg{width:110px;height:auto;max-width:100%;display:block}
.showtime .sweet svg,.sweet.fresh svg{animation:unwrap 1s var(--spring) .35s both}
@keyframes unwrap{0%{transform:translateY(-50px) rotate(-200deg) scale(.3);opacity:0}70%{transform:rotate(12deg) scale(1.12);opacity:1}100%{transform:none}}
.sweet .give{font-family:var(--serif);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sweet .name{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.1}
.sweet .why{font-size:15px;color:var(--muted);margin-top:4px}
.tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-alt);color:var(--good)}
.route{font-size:14px;color:var(--muted)}
.qrwrap{background:#FFFFFF;padding:14px;border-radius:var(--r);align-self:center;width:min(100%,300px)}
.qrwrap svg{display:block;width:100%;height:auto}
.small-print{font-size:12px;color:var(--muted)}

/* leaderboard */
.board{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow);border-radius:var(--r);padding:10px 12px;transition:transform .3s var(--spring)}
.lrow .rank{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.lrow .nm{font-weight:700;min-width:0}
.lrow .meter{height:10px;border-radius:999px;background:var(--surface-alt);margin-top:6px;overflow:hidden}
.lrow .meter span{display:block;height:100%;border-radius:999px;background:var(--hb-teal);transition:width .8s var(--spring)}
.lrow .ct{font-family:var(--serif);font-weight:700;font-size:26px;min-width:40px;text-align:right;font-variant-numeric:tabular-nums;color:var(--hb-blue-text)}
.lrow.top{background:linear-gradient(135deg,var(--hb-blue),var(--hb-blue-deep));color:var(--on-brand);border-color:transparent}
.lrow.top .rank,.lrow.top .ct{color:var(--on-brand)}
.lrow.top .meter{background:rgba(255,255,255,.2)} .lrow.top .meter span{background:var(--hb-citron)}
.crown{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--hb-citron);color:#1B2430;border-radius:999px;padding:2px 8px;vertical-align:middle}
.lrow.bump{animation:bump .6s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addgrid button{border:2px solid var(--hairline);background:var(--surface);border-radius:var(--r);padding:12px 10px;font-weight:700;font-size:14px;min-height:52px;transition:transform .2s var(--spring)}
.addgrid button:active{transform:scale(.92);border-color:var(--hb-blue)}
.total{display:flex;align-items:baseline;gap:10px}
.total b{font-family:var(--serif);font-size:40px;color:var(--hb-blue-text);line-height:1;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.danger{color:var(--warn)}

/* reveal stage */
.stage{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 42%,#1D6FC4 0%,var(--hb-navy) 60%,#020E1C 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.stage .beam{position:absolute;top:-20%;width:46%;height:140%;background:linear-gradient(180deg,rgba(255,255,230,.22),transparent 75%);filter:blur(6px);transform-origin:50% 0;pointer-events:none}
.stage .b1{left:2%;animation:sweepL 2.4s ease-in-out infinite alternate}
.stage .b2{right:2%;animation:sweepR 2.4s ease-in-out infinite alternate}
@keyframes sweepL{from{transform:rotate(18deg)}to{transform:rotate(-8deg)}}
@keyframes sweepR{from{transform:rotate(-18deg)}to{transform:rotate(8deg)}}
.stage .cap{font-family:var(--serif);font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.9;position:relative}
.reel{position:relative;min-height:2.4em;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:clamp(32px,10vw,54px);line-height:1.05;max-width:520px;text-wrap:balance}
.reel span{display:block;animation:tick .12s ease-out}
@keyframes tick{from{transform:translateY(-40%);opacity:.2;filter:blur(2px)}to{transform:none;opacity:1;filter:none}}
.stage.landed .reel span{animation:land .8s var(--spring) both;color:#fff;text-shadow:0 0 24px rgba(204,204,0,.9),0 0 60px rgba(204,204,0,.5)}
@keyframes land{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.stage .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.stage.landed .flash{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.stage .skip{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font-size:13px;opacity:.6}
.dots-run{display:flex;gap:8px;position:relative}
.dots-run i{width:12px;height:12px;border-radius:50%;animation:hop .9s ease-in-out infinite}
.dots-run i:nth-child(1){background:var(--hb-blue);border:2px solid #fff}.dots-run i:nth-child(2){background:var(--hb-teal);animation-delay:.15s}.dots-run i:nth-child(3){background:var(--hb-citron);animation-delay:.3s}.dots-run i:nth-child(4){background:var(--hb-grey);animation-delay:.45s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:55;background:var(--hb-navy);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toast 2.6s ease both;max-width:calc(100% - 32px);text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* save-as-picture sheet */
.sheet{position:fixed;inset:0;z-index:45;background:rgba(6,20,36,.86);overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:#fff;text-align:center;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet img{width:min(100%,420px);height:auto;border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.sheet .row{width:min(100%,420px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <button class="mark" id="homeBtn" type="button" aria-label="Back to start"><b>Henderson Black &amp; Co</b><small>Chartered Accountants</small></button>

    <button class="pillbtn" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound on"></button>
    <button class="pillbtn" id="boardBtn" type="button">Leaderboard</button>
  </div>
</header>
<main id="app"></main>
<div class="stage" id="stage" hidden aria-live="polite"></div>
<div class="sheet" id="picSheet" hidden></div>

const cv=document.getElementById("confetti");let parts=[],raf=null;
function confetti(n=160,originY=.35){
  if(reduced())return;
  const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  const cols=["#006DCA","#669999","#CCCC00","#CCCCCC","#FFFFFF","#6A2C8E","#EC7A1C","#C3202C"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;
    parts.push({x:innerWidth/2,y:innerHeight*originY,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0})}
  if(!raf)raf=requestAnimationFrame(drawConfetti);
}
function drawConfetti(){
  const ctx=cv.getContext("2d"),dpr=cv.width/innerWidth;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life<220&&p.y<innerHeight+40);
  for(const p of parts){p.life++;p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));ctx.restore()}
  raf=parts.length?requestAnimationFrame(drawConfetti):(ctx.clearRect(0,0,innerWidth,innerHeight),null);
}

  const steps=PUPIL
    ?[["Play","Six quick questions and a few words about you."],["Get your match","Twelve possible results. Which one are you?"],["Show us","Bring your result to our stand for the leaderboard and a sweet."]]
    :[["Ask","Read each question out to the pupil."],["Tap","Tap their answer, then reveal their match."],["Hand over","Give them the sweet on screen. Their result joins the leaderboard."]];
  const extras=PUPIL?"":`
    <div class="row">
      <button class="btn ghost" data-act="board" type="button">Leaderboard${total()?` (${total()})`:""}</button>
      ${HOSTED?'<button class="btn ghost" data-act="standqr" type="button">Show pupil QR</button>':""}
    </div>
    <p class="note">Ask about allergies before handing out. Quality Street contains milk, and The Purple One and Green Triangle contain hazelnuts.</p>`;
  return `<div class="screen">
    <div class="hero">
      <div class="slab">
        <div class="logo"><img src="${LOGO}" alt="Henderson Black & Co, Chartered Accountants"></div>
        <div class="caps">Careers fair game</div>
        <h1>Which accountant are you?</h1>
        <p class="lede">Six quick questions. Twelve possible matches. One Quality Street with your name on it.</p>
      </div>
      <div class="side">${DOTS}<i class="bt"></i><i class="bc"></i></div>
    </div>
    <button class="btn glow shine" data-act="start" type="button">${PUPIL?"Let's go":"Start a new pupil"}</button>
    ${stepsHTML(steps)}
    <div class="teasers">${tease}</div>
    ${extras}
  </div>`;
}
function progress(now){return `<div class="progress" aria-hidden="true"><span style="width:${Math.round(100*(now+1)/(QUESTIONS.length+1))}%"></span></div>`}
function renderQ(){
  const Q=QUESTIONS[run.qi],keys="ABCDEF",ord=run.order[run.qi];
  const opts=ord.map((oi,pos)=>`<button class="opt${run.answers[run.qi]===oi?" picked":""}" data-act="ans" data-i="${oi}" type="button"><span class="k">${keys[pos]}</span><span>${esc(Q.o[oi][0])}</span></button>`).join("");
  return `<div class="screen">
    ${progress(run.qi)}
    <div class="qhead"><div class="eyebrow">Question ${run.qi+1}</div><div class="qcount">${run.qi+1} / ${QUESTIONS.length}</div></div>
    <h2>${esc(Q.q)}</h2>
    <div class="opts">${opts}</div>
    <button class="link" data-act="back" type="button">← Back</button>
  </div>`;
}
function renderTraits(){
  const chips=TRAITS.map((t,i)=>`<button class="chip" aria-pressed="${run.traits.includes(i)}" data-act="trait" data-i="${i}" type="button">${esc(t[0])}</button>`).join("");
  return `<div class="screen">
    ${progress(QUESTIONS.length)}
    <div class="eyebrow">Final round</div>
    <h2>Tap any words that sound like you.</h2>
    <p class="small-print" style="font-size:15px">Pick as many as you like, or none.</p>
    <div class="chips">${chips}</div>
    <button class="btn glow shine" data-act="reveal" type="button">Reveal my match</button>
    <button class="link" data-act="back" type="button">← Back</button>
  </div>`;
}
function sweetSVG(c){
  return `<svg viewBox="0 0 200 110" role="img" aria-label="Wrapped sweet">
    <path d="M62 55 L14 18 Q8 55 14 92 Z" fill="${c}"/><path d="M138 55 L186 18 Q192 55 186 92 Z" fill="${c}"/>
    <path d="M62 55 L14 18 M62 55 L22 40 M62 55 L22 70 M62 55 L14 92 M138 55 L186 18 M138 55 L178 40 M138 55 L178 70 M138 55 L186 92" stroke="#000" stroke-opacity=".18" stroke-width="2" fill="none"/>
    <ellipse cx="100" cy="55" rx="44" ry="34" fill="${c}"/><ellipse cx="100" cy="55" rx="44" ry="34" fill="none" stroke="#000" stroke-opacity=".15" stroke-width="2"/>
    <ellipse cx="86" cy="40" rx="18" ry="8" fill="#fff" fill-opacity=".38" transform="rotate(-18 86 40)"/></svg>`;
}
function sweetBlock(){
  const S=SWEETS.find(x=>x.id===run.sweet);
  return `<div class="sweet" id="sweetCard">${sweetSVG(S.color)}
    <div style="min-width:0"><div class="give">Your sweet</div><div class="name">${esc(S.name)}</div>
    <p class="why">${esc(S.line)}</p></div></div>`;
}
function renderResult(){
  const T=TYPES[run.result];
  const actions=PUPIL
    ?`<p class="note info">Show this screen at the Henderson Black &amp; Co stand to collect your sweet. Scroll down to share or save your result.</p>`
    :`<div class="row"><button class="btn" data-act="next" type="button">Next pupil</button><button class="btn ghost" data-act="swap" type="button">Different sweet</button></div>
      <p class="note info">Added to the leaderboard: ${esc(short(run.result))} now has ${plural(board.counts[run.result]||0,"vote")}.</p>`;
  const takeHome=`<div class="panel share"><h3>Share or save your result</h3>
    <p>Send a picture of your result to friends or family, with a link so they can find out which accountant they are too.</p>
    <div class="row"><button class="btn" data-act="share" type="button">Share my result</button><button class="btn ghost" data-act="save" type="button">Save as picture</button></div>
    <button class="link" data-act="copylink" type="button">Copy the link to the game</button></div>`;
  return `<div class="screen">
    <div class="rh"><div class="result-head">
      <div class="eyebrow">You'd make a brilliant…</div>
      <h1>${esc(T.name)}</h1>
      <span class="pill">Real job: ${esc(T.role)}</span>
      <p>${esc(T.tag)}</p>
    </div><div class="bars" aria-hidden="true"><i style="background:var(--hb-teal)"></i><i style="background:var(--hb-citron)"></i></div></div>
    ${sweetBlock()}
    ${actions}
    <div class="panel hb"><h3>How this links to Henderson Black &amp; Co</h3><p>${esc(T.hb)}</p></div>
    <div class="panel"><h3>Work that would suit you</h3><ul>${T.work.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
    <div class="panel"><h3>Where you'd do it</h3><p>${esc(T.where)}</p></div>
    <div class="panel alt"><h3>Did you know?</h3><p>${esc(T.fact)}</p></div>
    ${takeHome}
    <p class="route">Every one of these careers starts by training as a chartered accountant (CA) with ICAS. You can start straight from school, through an apprenticeship or after university, and get paid while you train. Ask us about training with us in Cupar or St Andrews.</p>
    ${PUPIL?'<button class="btn ghost" data-act="next" type="button">Play again</button>':""}
  </div>`;
}
let bumpKey=null,confirmReset=false;
function renderBoard(){
  const keys=Object.keys(TYPES).sort((a,b)=>(board.counts[b]||0)-(board.counts[a]||0)||short(a).localeCompare(short(b)));
  const max=Math.max(1,...keys.map(k=>board.counts[k]||0)),tot=total();
  let rank=0,prev=null;
  const rows=keys.map((k,i)=>{const n=board.counts[k]||0;if(n!==prev){rank=i+1;prev=n}const top=n>0&&n===max;
    return `<div class="lrow${top?" top":""}${k===bumpKey?" bump":""}"><div class="rank">${n?rank:"–"}</div>
      <div class="nm">${esc(short(k))}${top?'<span class="crown">Top pick</span>':""}<div class="meter"><span style="width:${Math.round(100*n/max)}%"></span></div></div>
      <div class="ct">${n}</div></div>`}).join("");
  bumpKey=null;
  const add=Object.keys(TYPES).map(k=>`<button type="button" data-act="add" data-k="${k}">+ ${esc(short(k))}</button>`).join("");
  return `<div class="screen">
    <div class="eyebrow">Today's leaderboard</div>
    <div class="total"><b>${tot}</b><span>${tot===1?"pupil matched so far":"pupils matched so far"}</span></div>
    <div class="board">${rows}</div>
    <div class="panel"><h3>Add a pupil's result</h3><p class="small-print" style="font-size:14px">Played on their own phone? Tap the result they show you.</p><div class="addgrid">${add}</div>
      ${board.log.length?`<button class="link" data-act="undo" type="button">Undo last (${esc(short(board.log[board.log.length-1]))})</button>`:""}</div>
    <div class="confirm">${confirmReset?`<span>Clear the whole leaderboard?</span><button class="btn small" style="background:var(--warn);box-shadow:none" data-act="resetyes" type="button">Yes, clear it</button><button class="link" data-act="resetno" type="button">Cancel</button>`:`<button class="link danger" data-act="reset" type="button">Clear leaderboard</button>`}</div>
    <button class="btn ghost" data-act="next" type="button">Back to start</button>
  </div>`;
}
function renderStandQR(){
  const svg=qrSVG(pupilURL(),"QR code to play the game on your own phone");
  return `<div class="screen">
    <div class="eyebrow">Play on your own phone</div>
    <h2>Scan to find out which accountant you are</h2>
    ${svg?`<div class="qrwrap">${svg}</div>`:'<p class="note">The QR code couldn\'t load.</p>'}
    <p class="small-print" style="text-align:center;word-break:break-all">${esc(pupilURL())}</p>
    <button class="btn ghost" data-act="next" type="button">Done</button>
  </div>`;
}

/* ---------- reveal show ---------- */
let showTimers=[],showing=false;
function startShow(){
  const final=TYPES[run.result].name;
  if(reduced()){finishShow();return}
  showing=true;stage.hidden=false;stage.className="stage";
  stage.innerHTML=`<div class="beam b1"></div><div class="beam b2"></div><div class="flash"></div>
    <div class="cap">And you are…</div><div class="dots-run"><i></i><i></i><i></i><i></i></div><div class="reel" id="reel"><span>…</span></div><div class="skip">Tap to skip</div>`;
  const names=shuffle(Object.values(TYPES).map(t=>t.name).filter(n=>n!==final));
  const steps=20;let t=350;const reel=document.getElementById("reel");
  drumroll(2.9);buzz(20);
  for(let i=0;i<steps;i++){const name=i===steps-1?final:names[i%names.length];
    t+=55+Math.pow(i/steps,2.6)*360;
    showTimers.push(setTimeout(()=>{reel.innerHTML=`<span>${esc(name)}</span>`;if(i%2===0)tone(300+i*18,.05,"square",.03)},t))}
  showTimers.push(setTimeout(land,t+120));
  stage.onclick=()=>{showTimers.forEach(clearTimeout);showTimers=[];reel.innerHTML=`<span>${esc(final)}</span>`;land()};
}
function land(){
  stage.onclick=()=>finishShow();
  stage.classList.add("landed");const d=stage.querySelector(".dots-run");if(d)d.style.visibility="hidden";
  stage.querySelector(".skip").textContent="Tap to see your result";
  tada();buzz([40,60,90]);confetti(200,.42);
  showTimers.push(setTimeout(finishShow,1900));
}
function finishShow(){
  showTimers.forEach(clearTimeout);showTimers=[];showing=false;stage.hidden=true;stage.onclick=null;
  run.screen="result";render(false,"showtime");confetti(90,.1);
}

/* ---------- actions ---------- */
function bind(){app.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",e=>act(b.dataset.act,+b.dataset.i,b,e)))}
function ripple(el,e){if(reduced()||!el.getBoundingClientRect)return;const r=el.getBoundingClientRect(),s=document.createElement("span"),d=Math.max(r.width,r.height);
  s.className="ripple";s.style.cssText=`width:${d}px;height:${d}px;left:${(e&&e.clientX?e.clientX-r.left:r.width/2)-d/2}px;top:${(e&&e.clientY?e.clientY-r.top:r.height/2)-d/2}px`;el.appendChild(s);setTimeout(()=>s.remove(),600)}
let busy=false,advT=null;
function act(a,i,el,e){
  if(showing)return;
  if(busy){if(a==="back"){clearTimeout(advT);busy=false}else return}
  if(el&&el.classList&&(el.classList.contains("btn")||el.classList.contains("opt")))ripple(el,e);
  if(a==="start"){blip(0);buzz(12);run=blankRun();run.screen="q";wake()}
  else if(a==="ans"){
    busy=true;run.answers[run.qi]=i;blip(run.qi+1);buzz(10);
    const r=el.getBoundingClientRect();sparks(e&&e.clientX?e.clientX:r.left+r.width/2,e&&e.clientY?e.clientY:r.top+r.height/2);
    app.querySelectorAll(".opt").forEach(o=>o.classList.remove("picked"));el.classList.add("picked");el.parentElement.classList.add("chosen");
    const bar=app.querySelector(".progress span");if(bar)bar.style.width=Math.round(100*(run.qi+2)/(QUESTIONS.length+1))+"%";
    advT=setTimeout(()=>{busy=false;if(run.qi<QUESTIONS.length-1)run.qi++;else run.screen="traits";render()},reduced()?120:520);
    return;
  }
  else if(a==="back"){blip(0);if(run.screen==="traits"){run.screen="q";run.qi=QUESTIONS.length-1}else if(run.qi>0)run.qi--;else run.screen="home"}
  else if(a==="trait"){const k=run.traits.indexOf(i);k>=0?run.traits.splice(k,1):run.traits.push(i);el.setAttribute("aria-pressed",k<0);blip(k<0?4:1);buzz(8);
    if(k<0){const r=el.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2)}return}
  else if(a==="reveal"){
    run.result=scoreResult();run.sweet=pickSweet(run.result);
    if(PUPIL){try{sessionStorage.setItem(PKEY,JSON.stringify({result:run.result,sweet:run.sweet}))}catch(x){}}else logResult(run.result);
    startShow();return;
  }
  else if(a==="swap"){run.sweet=pickSweet(run.result,[run.sweet]);blip(3);
    const card=document.getElementById("sweetCard");if(card){card.outerHTML=sweetBlock();const n=document.getElementById("sweetCard");n.classList.add("fresh")}prepCard();return}
  else if(a==="share"){shareResult();return}
  else if(a==="save"){savePicture();return}
  else if(a==="copylink"){copyLink();return}
  else if(a==="board"){run=blankRun();run.screen="board"}
  else if(a==="add"){const k=el.dataset.k;logResult(k);bumpKey=k;blip(5);buzz(15);const r=el.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2);confetti(40,.25);
    const y=window.scrollY;app.innerHTML=renderBoard();bind();window.scrollTo(0,y);flash(`Added: ${short(k)}`);return}
  else if(a==="undo"){const k=board.log.pop();if(k&&board.counts[k])board.counts[k]--;saveBoard();const y=window.scrollY;app.innerHTML=renderBoard();bind();window.scrollTo(0,y);return}
  else if(a==="reset"){confirmReset=true;const y=window.scrollY;app.innerHTML=renderBoard();bind();window.scrollTo(0,y);return}
  else if(a==="resetno"){confirmReset=false;const y=window.scrollY;app.innerHTML=renderBoard();bind();window.scrollTo(0,y);return}
  else if(a==="resetyes"){confirmReset=false;board={counts:{},log:[]};saveBoard()}
  else if(a==="standqr"){run=blankRun();run.screen="standqr"}
  else if(a==="next"){if(PUPIL){try{sessionStorage.removeItem(PKEY)}catch(x){}}run=blankRun()}
  render();
}
function flash(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const p=document.createElement("div");p.className="toast";p.textContent=msg;p.setAttribute("role","status");document.body.appendChild(p);setTimeout(()=>p.remove(),2700)}

// The picture is made as soon as the result appears, so tapping Share opens the share sheet straight away (iPhones refuse a share that starts too long after the tap).
let cardBlob=null,cardFor=null,cardJob=null;
function prepCard(){const key=run.result+"|"+run.sweet;if(cardFor===key&&(cardBlob||cardJob))return cardJob;cardFor=key;cardBlob=null;
  cardJob=makeCard().then(b=>{if(cardFor===key)cardBlob=b;return b}).catch(()=>null);return cardJob}
function shareResult(){
  const title=`I'm ${TYPES[run.result].name}!`,text=shareText(),url=GAME_URL;
  const file=cardBlob&&new File([cardBlob],"my-accountant-match.png",{type:"image/png"});
  const fallback=()=>{try{navigator.clipboard.writeText(text+" "+url).then(()=>flash("Result and link copied. Paste them into a message."),()=>flash("Sharing isn't available here. Use Save as picture instead."))}catch(x){flash("Sharing isn't available here. Use Save as picture instead.")}};
  try{
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title,text:text+" "+url}).catch(err=>{if(!err||err.name!=="AbortError")navigator.share({title,text,url}).catch(()=>{})});return}
    if(navigator.share){navigator.share({title,text,url}).catch(err=>{if(!err||err.name!=="AbortError")fallback()});return}
  }catch(err){}
  fallback();
}
function copyLink(){try{navigator.clipboard.writeText(GAME_URL).then(()=>flash("Link copied: "+GAME_URL.replace("https://","")),()=>flash(GAME_URL.replace("https://","")))}catch(e){flash(GAME_URL.replace("https://",""))}}
let picURL=null;
async function savePicture(){
  pic.hidden=false;pic.innerHTML=`<p>Making your picture…</p>`;
  const blob=cardBlob||await prepCard();if(!blob){pic.innerHTML=`<p>Sorry, the picture couldn't be made on this phone. Take a screenshot instead.</p><button class="btn ghost" type="button" id="picClose">Close</button>`;document.getElementById("picClose").onclick=closePic;return}
  if(picURL)URL.revokeObjectURL(picURL);picURL=URL.createObjectURL(blob);
  pic.innerHTML=`<h3 style="color:#fff">Your result picture</h3><img src="${picURL}" alt="Picture of your result: ${esc(TYPES[run.result].name)}">
    <p style="font-size:15px">On a phone, press and hold the picture, then choose <b>Save</b> or <b>Add to Photos</b>.</p>
    <div class="row"><a class="btn" href="${picURL}" download="my-accountant-match.png">Download picture</a><button class="btn ghost" type="button" id="picClose">Close</button></div>`;
  document.getElementById("picClose").onclick=closePic;
}
function closePic(){pic.hidden=true;pic.innerHTML=""}

/* ---------- history, keys, wake lock, sound ---------- */
window.addEventListener("popstate",()=>{
  if(!pic.hidden){closePic();try{history.pushState({g:lastKey},"")}catch(e){}return}
  if(showing){finishShow();return}
  if(busy)return;
  const s=run.screen;
  if(s==="q"){if(run.qi>0)run.qi--;else run.screen="home"}
  else if(s==="traits"){run.screen="q";run.qi=QUESTIONS.length-1}
  else if(s==="result"&&PUPIL){try{history.pushState({g:"keep"},"")}catch(e){}return}
  else if(s!=="home"){run=blankRun()}
  render(true);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!pic.hidden)closePic();else if(showing)finishShow()}});
let lock=null,wantLock=false;
async function wake(){if(PUPIL)return;wantLock=true;try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>lock=null)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(wantLock&&document.visibilityState==="visible")wake()});
window.addEventListener("hashchange",()=>{if((location.hash.replace("#","")==="pupil")!==PUPIL)location.reload()});
const soundBtn=document.getElementById("soundBtn");
function paintSound(){soundBtn.innerHTML=soundOn?ICON_ON:ICON_OFF;soundBtn.setAttribute("aria-pressed",String(soundOn));soundBtn.setAttribute("aria-label",soundOn?"Sound on":"Sound off")}
soundBtn.addEventListener("click",()=>{soundOn=!soundOn;try{localStorage.setItem(SKEY,soundOn?"1":"0")}catch(e){}paintSound();if(soundOn)blip(2)});
const boardBtn=document.getElementById("boardBtn");
if(PUPIL)boardBtn.hidden=true;
boardBtn.addEventListener("click",()=>{if(showing||busy)return;run=blankRun();run.screen="board";render()});
document.getElementById("homeBtn").addEventListener("click",()=>{if(busy||showing)return;if(PUPIL&&run.screen==="result"){try{sessionStorage.removeItem(PKEY)}catch(e){}}run=blankRun();render()});

/* ---------- boot ---------- */
function start(d){
  paintSound();
  if(d&&d.run)run=Object.assign(blankRun(),d.run);
  else if(PUPIL){try{const s=JSON.parse(sessionStorage.getItem(PKEY)||"null");if(s&&TYPES[s.result]){run.result=s.result;run.sweet=s.sweet||pickSweet(s.result);run.screen="result"}}catch(e){}}
  render();
  requestAnimationFrame(()=>document.body.classList.add("ready"));
}
window.claude?.hot?.snapshot?.(()=>({run}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body>
</html>
